<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaSSHboard</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app-layout">
      <!-- The app-action buttons live in the tab-strip row (mounted there by the
           TabManager). Kept hidden here at their construction site until moved so
           they don't flash in the top-left corner on first paint. -->
      <div class="header-actions" hidden>
        <button type="button" id="reload-btn" class="icon-btn"
          data-i18n-title="header.reload.title" data-i18n-aria="header.reload.aria"
          title="Reload devices, profiles &amp; settings from disk (picks up changes from another window)"
          aria-label="Reload configuration from disk"></button>
        <button type="button" id="trusted-hosts-btn" class="icon-btn"
          data-i18n-title="header.trustedHosts.title" data-i18n-aria="header.trustedHosts.aria"
          title="Manage trusted hosts" aria-label="Manage trusted hosts"></button>
        <button type="button" id="settings-btn" class="icon-btn"
          data-i18n-title="header.settings.title" data-i18n-aria="header.settings.aria"
          title="Settings" aria-label="Settings"></button>
        <button type="button" id="help-btn" class="icon-btn"
          data-i18n-title="header.help.title" data-i18n-aria="header.help.aria"
          title="About DaSSHboard" aria-label="About DaSSHboard"></button>
      </div>

      <div class="app-content">
        <aside class="sidebar">
          <div class="profile-list"></div>
          <div class="device-list"></div>
          <div class="tunnel-list"></div>
          <div class="sftp-list"></div>
        </aside>

        <main class="main-content">
          <div id="pane-root" class="pane-root"
            data-i18n-aria="header.paneRoot.aria" aria-label="SSH terminal"></div>
        </main>
      </div>
    </div>
  </body>
</html>
