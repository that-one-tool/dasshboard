name: site-check

# Reusable website gate: `npm run check` in apps/website (astro check, the
# Vitest suite, astro build). Called by ci.yml (on pull requests touching the
# site) and site-deploy.yml (which also uploads the built site as the Pages
# artifact), so PR CI and the deployed build can never drift apart.

on:
    workflow_call:
        inputs:
            upload-pages-artifact:
                description: "Upload apps/website/dist as the GitHub Pages artifact."
                type: boolean
                default: false

env:
    ASTRO_TELEMETRY_DISABLED: "1"

jobs:
    check:
        runs-on: ubuntu-22.04
        defaults:
            run:
                working-directory: apps/website
        steps:
            # Full repo checkout: the build reads the desktop version from
            # apps/desktop/src-tauri/tauri.conf.json.
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: install npm dependencies
              run: npm ci

            - name: check (astro check, Vitest, build)
              run: npm run check

            # The Flatpak repo (dist/flatpak/repo, .flatpakref, .flatpakrepo)
            # comes from the newest release carrying one, so a site-only deploy
            # or a release whose Flatpak upload failed keeps serving it.
            - name: add the Flatpak repo
              if: ${{ inputs.upload-pages-artifact }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p dist/flatpak
                  for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName --jq '.[].tagName'); do
                    if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern dasshboard-flatpak.tar.gz --output - | tar -xz -C dist/flatpak; then
                      echo "Flatpak repo from $tag"
                      exit 0
                    fi
                  done
                  echo "::warning::No release carries a Flatpak repo; the site deploys without one."

            - name: upload Pages artifact
              if: ${{ inputs.upload-pages-artifact }}
              uses: actions/upload-pages-artifact@v4
              with:
                  path: apps/website/dist
