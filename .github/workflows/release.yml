name: release

# Draft -> build -> publish a CrabNebula Cloud release with Windows (msi, nsis)
# and Linux (deb, rpm) installers. Adapted from
# https://docs.crabnebula.dev/cloud/ci/tauri-v2-workflow/ (desktop-only: no
# macOS/Android/iOS jobs, since this app doesn't target those platforms).
#
# Required repo secrets:
#   CN_API_KEY                         - CrabNebula Cloud API key for that-one-tool/dasshboard
#   TAURI_SIGNING_PRIVATE_KEY          - updater signing private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - password for the private key above

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CN_APPLICATION: "that-one-tool/dasshboard"

jobs:
    # CrabNebula/Tauri read the release version from src-tauri/tauri.conf.json
    # (Cargo.toml as its own fallback) — never from package.json. Fail fast if
    # the three drift apart instead of silently releasing the wrong version.
    check-versions:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v5
            - name: verify package.json, tauri.conf.json, and Cargo.toml versions match
              run: |
                  PKG_VERSION=$(jq -r .version package.json)
                  TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
                  CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
                  echo "package.json: $PKG_VERSION"
                  echo "tauri.conf.json: $TAURI_VERSION"
                  echo "Cargo.toml: $CARGO_VERSION"
                  if [ "$PKG_VERSION" != "$TAURI_VERSION" ] || [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
                    echo "::error::Version mismatch: package.json=$PKG_VERSION tauri.conf.json=$TAURI_VERSION Cargo.toml=$CARGO_VERSION"
                    exit 1
                  fi

    draft:
        needs: check-versions
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v5
            - name: create draft release
              uses: crabnebula-dev/cloud-release@v0
              with:
                  command: release draft ${{ env.CN_APPLICATION }} --framework tauri
                  api-key: ${{ secrets.CN_API_KEY }}

    build:
        needs: draft
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-22.04
                    - windows-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: install Rust stable
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: stable
                  cache: true

            # Tauri's official Linux prerequisites for building + bundling
            # (deb/rpm bundling itself is pure-Rust, no extra system tool needed).
            - name: install Linux dependencies
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  # The GitHub ubuntu-22.04 runner ships with Google's apt repo
                  # pre-added. It periodically serves a Packages index whose hash
                  # doesn't match its Release file, which fails `apt-get update`
                  # with a "Hash Sum mismatch" (exit 100) and blocks the build.
                  # Chrome isn't needed to build/bundle Tauri, so drop that repo
                  # (and any other pre-added third-party lists) before updating.
                  sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/*.list.save
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: install npm dependencies
              run: npm ci

            - name: build Tauri app
              run: npm exec tauri build
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            - name: upload assets
              uses: crabnebula-dev/cloud-release@v0
              with:
                  command: release upload ${{ env.CN_APPLICATION }} --framework tauri
                  api-key: ${{ secrets.CN_API_KEY }}

    publish:
        needs: build
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v5
            - name: publish release
              uses: crabnebula-dev/cloud-release@v0
              with:
                  command: release publish ${{ env.CN_APPLICATION }} --framework tauri
                  api-key: ${{ secrets.CN_API_KEY }}

    # Only after the CrabNebula publish succeeds: tag the released commit and cut
    # the matching GitHub release. Idempotent — every push to main runs this, but
    # it no-ops once a release for the current version exists, so it fires exactly
    # once per version bump. `check-versions` guarantees tauri.conf.json is the
    # canonical version.
    tag-and-release:
        needs: publish
        runs-on: ubuntu-22.04
        permissions:
            contents: write # create tags + releases with GITHUB_TOKEN
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0 # need existing tags to test for the version
            - name: create tag and GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(jq -r .version src-tauri/tauri.conf.json)
                  TAG="v${VERSION}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "Release $TAG already exists — nothing to do."
                    exit 0
                  fi
                  # `gh release create` creates the tag if missing, or reuses an existing
                  # one (a tag the maintainer pushed by hand); --target is ignored then.
                  gh release create "$TAG" \
                    --target "$GITHUB_SHA" \
                    --title "$TAG" \
                    --generate-notes
